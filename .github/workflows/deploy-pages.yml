name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allows triggering a deployment manually from the Actions tab (or via
  # the API) against any branch — used to verify the site before the
  # branch carrying this workflow has been merged to main.
  workflow_dispatch:

# Only one Pages deployment at a time; a newer run cancels a queued (not
# in-progress) older one instead of racing it.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages (source: GitHub Actions) automatically if
          # it isn't already — falls back to the clear error below (with
          # the manual Settings steps) if the token lacks permission to.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
